name: PR CI

on:
  pull_request:
    paths:
      - "build.zig"
      - "build.zig.zon"
      - "README.md"
      - "apps/seq/**"
      - "apps/lift/**"
      - "apps/cas/**"
      - "apps/ledger/**"
      - "apps/memory-note/**"
      - "apps/img/**"
      - "libs/core/**"
      - "libs/definition_core/**"
      - "libs/definition_compat/**"
      - "libs/durable_store/**"
      - "libs/jsonl_core/**"
      - "libs/trace_core/**"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/auto-release.yml"
      - "tools/durable_store_perf.zig"
      - "tools/perf_hub.zig"
      - "tools/perf_contract.zig"
      - "docs/release/**"
      - ".github/workflows/pr-ci.yml"

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      seq: ${{ steps.classify.outputs.seq }}
      lift: ${{ steps.classify.outputs.lift }}
      cas: ${{ steps.classify.outputs.cas }}
      ledger: ${{ steps.classify.outputs.ledger }}
      memory_note: ${{ steps.classify.outputs.memory_note }}
      img: ${{ steps.classify.outputs.img }}
      perf: ${{ steps.classify.outputs.perf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed owners
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          declare -A selected=()
          while IFS= read -r app; do
            selected["$app"]=true
          done < <(.github/scripts/release_apps.sh ci-affected "$base" "$head")

          changed_paths="$(git diff --name-only "$base" "$head")"
          if grep -Fxq ".github/scripts/linux_fuzz_gate.sh" <<<"$changed_paths"; then
            selected[seq]=true
            selected[lift]=true
            selected[cas]=true
          fi

          for app in seq lift cas ledger memory-note img; do
            output_name="${app//-/_}"
            echo "${output_name}=${selected[$app]:-false}" >> "$GITHUB_OUTPUT"
          done

          perf=${selected[seq]:-false}
          if [[ "${selected[cas]:-false}" == true ]] ||
             grep -Fxq 'build.zig' <<<"$changed_paths" ||
             grep -Fxq 'tools/perf_hub.zig' <<<"$changed_paths" ||
             grep -Fxq 'tools/perf_contract.zig' <<<"$changed_paths"; then
            perf=true
          fi
          echo "perf=$perf" >> "$GITHUB_OUTPUT"

  install-prefix-guard:
    needs: changes
    if: needs.changes.outputs.seq == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Root build rejects custom install prefix
        run: |
          set -euo pipefail
          if zig build build-seq -Doptimize=ReleaseFast --prefix "${RUNNER_TEMP}/skills-zig-prefix"; then
            echo "expected root build to reject a custom install prefix" >&2
            exit 1
          fi
      - name: Standalone seq build rejects custom install prefix
        working-directory: apps/seq
        run: |
          set -euo pipefail
          if zig build -Doptimize=ReleaseFast --prefix "${RUNNER_TEMP}/seq-prefix"; then
            echo "expected standalone seq build to reject a custom install prefix" >&2
            exit 1
          fi

  release-contract:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release app classifier
        run: .github/scripts/test_release_apps.sh
      - name: Test Seq CI proof matrix
        run: .github/scripts/test_seq_ci_job.sh
      - name: Test Seq qualify-before-tag release transaction
        run: .github/scripts/test_seq_release_transaction.sh
      - name: Test CAS archive verifier
        run: .github/scripts/test_verify_cas_archive.sh
      - name: Require VERSION bumps for release-relevant CLI changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t affected < <(.github/scripts/release_apps.sh affected "$base" "$head")
          if [ "${#affected[@]}" -eq 0 ]; then
            echo "No release-relevant CLI surfaces changed."
            exit 0
          fi

          echo "Affected release apps: ${affected[*]}"
          missing=()
          for app in "${affected[@]}"; do
            if git diff --quiet "$base" "$head" -- "apps/$app/VERSION"; then
              missing+=("$app")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing VERSION bumps for release-relevant CLI changes: ${missing[*]}" >&2
            exit 1
          fi

  seq:
    needs: changes
    if: needs.changes.outputs.seq == 'true'
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Restore Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            .zig-cache-global
          key: zig-seq-${{ runner.os }}-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'apps/seq/**', 'libs/core/**', 'libs/definition_core/src/*', 'libs/definition_core/tests/*', 'libs/trace_core/src/*', 'libs/trace_core/tests/*', '.github/workflows/pr-ci.yml') }}
          restore-keys: |
            zig-seq-${{ runner.os }}-0.16.0-
      - name: Build seq integration surface
        run: zig build build-seq -Doptimize=ReleaseFast --summary all
      - name: Test Seq 1.0 kernel and command surface
        run: zig build test-seq test-seq-core test-seq-cli-smoke -Doptimize=ReleaseFast --summary all
      - name: Test definition core contracts
        run: zig build test-definition-core test-definition-core-guard -Doptimize=ReleaseFast --summary all
      - name: Test trace core contracts
        run: zig build test-trace-core -Doptimize=ReleaseFast --summary all
      - name: Test JSONL core contracts
        run: zig build test-jsonl-core --summary all
      - name: Test durable store contracts
        run: zig build test-durable-store --summary all
      - name: Test durable store performance contracts
        run: zig build test-durable-store-perf --summary all
      - name: Verify non-macOS seq command and capability admission
        run: apps/seq/scripts/release/command_surface_gate.sh zig-out/bin/seq

  seq-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.seq == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz passive definition parsing (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test -Mroot=libs/definition_core/src/root.zig -ffuzz --test-filter "fuzz "

  lift:
    needs: changes
    if: needs.changes.outputs.lift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build lift binaries
        run: zig build build-lift -Doptimize=ReleaseFast
      - name: Test lift
        run: zig build test-lift

  lift-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.lift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz lift bench_stats (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test --dep core_io --dep core_cli -Mroot=apps/lift/scripts/bench_stats.zig -Mcore_io=libs/core/src/io_helpers.zig -Mcore_cli=libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz "

  cas:
    needs: changes
    if: needs.changes.outputs.cas == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            zig_target: x86_64-linux-musl
            cas_static: true
            runner_arch: X64
            codex_asset: codex-x86_64-unknown-linux-musl.tar.gz
            codex_archive_sha256: 5ba3b9405543953081f661d0854d266f76e2abbe51d41349355a36de7673776a
          - os: macos-14
            platform: macos-aarch64
            zig_target: aarch64-macos
            cas_static: false
            runner_arch: ARM64
            codex_asset: codex-aarch64-apple-darwin.tar.gz
            codex_archive_sha256: 2750132d300e64f1dbffb95e3d913fd9c9dc7812bc8e1bce5c61357248b7929e
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install and fingerprint exact Codex 0.146.0
        shell: bash
        env:
          CODEX_ASSET: ${{ matrix.codex_asset }}
          CODEX_ARCHIVE_SHA256: ${{ matrix.codex_archive_sha256 }}
          CODEX_PLATFORM: ${{ matrix.platform }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail

          if [[ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]]; then
            echo "Expected ${CODEX_PLATFORM} runner architecture ${EXPECTED_RUNNER_ARCH}, got ${RUNNER_ARCH}" >&2
            exit 1
          fi

          release_url="https://github.com/openai/codex/releases/download/rust-v0.146.0/${CODEX_ASSET}"
          archive="${RUNNER_TEMP}/${CODEX_ASSET}"
          extract_dir="${RUNNER_TEMP}/codex-0.146.0"
          bin_dir="${RUNNER_TEMP}/codex-bin"
          stable_schema_dir="${RUNNER_TEMP}/codex-schema/stable"
          experimental_schema_dir="${RUNNER_TEMP}/codex-schema/experimental"
          evidence="${RUNNER_TEMP}/cas-codex-0.146.0-${CODEX_PLATFORM}.txt"

          curl --fail --location --retry 3 --output "${archive}" "${release_url}"
          archive_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          if [[ "${archive_sha256}" != "${CODEX_ARCHIVE_SHA256}" ]]; then
            echo "Codex archive digest mismatch: expected ${CODEX_ARCHIVE_SHA256}, got ${archive_sha256}" >&2
            exit 1
          fi

          mkdir -p "${extract_dir}" "${bin_dir}" "${stable_schema_dir}" "${experimental_schema_dir}"
          tar -xzf "${archive}" -C "${extract_dir}"
          extracted_file_count="$(find "${extract_dir}" -type f -print | wc -l | tr -d ' ')"
          if [[ "${extracted_file_count}" -ne 1 ]]; then
            echo "Expected exactly one file in ${CODEX_ASSET}, found ${extracted_file_count}" >&2
            exit 1
          fi
          extracted_file="$(find "${extract_dir}" -type f -print)"
          cp "${extracted_file}" "${bin_dir}/codex"
          chmod +x "${bin_dir}/codex"

          codex_version="$("${bin_dir}/codex" --version)"
          if [[ "${codex_version}" != "codex-cli 0.146.0" ]]; then
            echo "Expected codex-cli 0.146.0, got ${codex_version}" >&2
            exit 1
          fi
          binary_sha256="$(shasum -a 256 "${bin_dir}/codex" | awk '{print $1}')"

          "${bin_dir}/codex" app-server generate-json-schema --out "${stable_schema_dir}"
          "${bin_dir}/codex" app-server generate-json-schema --experimental --out "${experimental_schema_dir}"

          digest_directory() {
            local directory="$1"
            (
              cd "${directory}"
              find . -type f -print | LC_ALL=C sort | while IFS= read -r schema_path; do
                file_sha256="$(shasum -a 256 "${schema_path}" | awk '{print $1}')"
                printf '%s  %s\n' "${file_sha256}" "${schema_path}"
              done
            ) | shasum -a 256 | awk '{print $1}'
          }

          stable_schema_sha256="$(digest_directory "${stable_schema_dir}")"
          experimental_schema_sha256="$(digest_directory "${experimental_schema_dir}")"
          {
            echo "platform=${CODEX_PLATFORM}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "uname=$(uname -a)"
            echo "release=rust-v0.146.0"
            echo "archive=${CODEX_ASSET}"
            echo "archive_sha256=${archive_sha256}"
            echo "codex_version=${codex_version}"
            echo "binary_sha256=${binary_sha256}"
            echo "stable_schema_sha256=${stable_schema_sha256}"
            echo "experimental_schema_sha256=${experimental_schema_sha256}"
          } | tee "${evidence}"

          {
            echo "### CAS Codex 0.146.0 evidence (${CODEX_PLATFORM})"
            echo '```text'
            cat "${evidence}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "CODEX_BIN=${bin_dir}/codex" >> "${GITHUB_ENV}"
          echo "${bin_dir}" >> "${GITHUB_PATH}"
      - name: Fetch pinned SQLite amalgamation
        shell: bash
        run: |
          set -euo pipefail
          sqlite_version=3450100
          sqlite_sha256=5592243caf28b2cdef41e6ab58d25d653dfc53deded8450eb66072c929f030c4
          sqlite_archive="${RUNNER_TEMP}/sqlite-amalgamation-${sqlite_version}.zip"
          sqlite_root="${RUNNER_TEMP}/sqlite-amalgamation-${sqlite_version}"
          curl --fail --location --retry 3 \
            --output "${sqlite_archive}" \
            "https://www.sqlite.org/2024/sqlite-amalgamation-${sqlite_version}.zip"
          actual_sha256="$(shasum -a 256 "${sqlite_archive}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${sqlite_sha256}" ]]; then
            echo "SQLite archive digest mismatch: ${actual_sha256}" >&2
            exit 1
          fi
          unzip -q "${sqlite_archive}" -d "${RUNNER_TEMP}"
          test -f "${sqlite_root}/sqlite3.c"
          echo "CAS_SQLITE_AMALGAMATION=${sqlite_root}/sqlite3.c" >> "${GITHUB_ENV}"
      - name: Build cas binaries
        run: >-
          zig build build-cas
          -Dtarget=${{ matrix.zig_target }}
          -Dcpu=baseline
          -Doptimize=ReleaseFast
          -Dcas-static=${{ matrix.cas_static }}
          -Dcas-sqlite-amalgamation="${CAS_SQLITE_AMALGAMATION}"
      - name: Verify pinned SQLite release boundary
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              for binary in \
                cas cas_account cas_app_server_preflight cas_automation \
                cas_smoke_check cas_instance_runner cas_review_session \
                cas_session_inquiry cas_conformance_suite cas_goal \
                cas-perf-budget-governor; do
                if objdump -p "zig-out/bin/${binary}" | grep -Fq NEEDED; then
                  echo "CAS release binary is dynamically linked: ${binary}" >&2
                  exit 1
                fi
              done
              ;;
            macOS)
              if otool -L zig-out/bin/cas_automation | grep -Fq libsqlite3; then
                echo "CAS Automation unexpectedly depends on system SQLite" >&2
                exit 1
              fi
              ;;
          esac
          apps/cas/testdata/automation/cron-0.2.13/verify.sh \
            ./zig-out/bin/cas automation
      - name: Verify exact Codex 0.146.0 app-server contract
        run: .github/scripts/test_cas_app_server_preflight_0146.sh "${CODEX_BIN}"
      - name: Verify packaged Linux CAS dispatcher layout
        if: matrix.platform == 'linux-x86_64'
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/cas-release"
          archive="${RUNNER_TEMP}/cas-pr-linux-x86_64.tar.gz"
          mkdir -p "${package_dir}"
          cp zig-out/bin/cas "${package_dir}/cas"
          cp zig-out/bin/cas_account "${package_dir}/cas_account"
          cp zig-out/bin/cas_app_server_preflight "${package_dir}/cas_app_server_preflight"
          cp zig-out/bin/cas_automation "${package_dir}/cas_automation"
          cp zig-out/bin/cas_smoke_check "${package_dir}/cas_smoke_check"
          cp zig-out/bin/cas_smoke_check "${package_dir}/cas-smoke-check"
          cp zig-out/bin/cas_instance_runner "${package_dir}/cas_instance_runner"
          cp zig-out/bin/cas_instance_runner "${package_dir}/cas-instance-runner"
          cp zig-out/bin/cas_review_session "${package_dir}/cas_review_session"
          cp zig-out/bin/cas_review_session "${package_dir}/cas-review-session"
          cp zig-out/bin/cas_session_inquiry "${package_dir}/cas_session_inquiry"
          cp zig-out/bin/cas_session_inquiry "${package_dir}/cas-session-inquiry"
          cp zig-out/bin/cas_conformance_suite "${package_dir}/cas_conformance_suite"
          cp zig-out/bin/cas_conformance_suite "${package_dir}/cas-conformance-suite"
          cp zig-out/bin/cas_goal "${package_dir}/cas_goal"
          cp zig-out/bin/cas_goal "${package_dir}/cas-goal"
          cp zig-out/bin/cas-perf-budget-governor "${package_dir}/cas-perf-budget-governor"
          tar -czf "${archive}" -C "${package_dir}" .
          .github/scripts/verify_cas_archive.sh linux-x86_64 "${archive}"
      - name: Test generic CAS surfaces
        run: zig build test-cas
      - name: Upload exact Codex evidence
        uses: actions/upload-artifact@v4
        with:
          name: cas-codex-0.146.0-${{ matrix.platform }}
          path: ${{ runner.temp }}/cas-codex-0.146.0-${{ matrix.platform }}.txt
          if-no-files-found: error

  cas-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.cas == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz CAS budget governor (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test --dep core_json --dep core_io --dep core_cli -Mroot=apps/cas/scripts/budget_governor.zig -Mcore_json=libs/core/src/json_helpers.zig -Mcore_io=libs/core/src/io_helpers.zig -Mcore_cli=libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz governor"

  perf-hub:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test performance hub
        run: zig build test-perf-hub

  ledger:
    needs: changes
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build ledger
        run: zig build build-ledger -Doptimize=ReleaseFast
      - name: Test Ledger 1.0 kernel and command surface
        run: zig build test-ledger test-ledger-core test-ledger-cli-smoke -Doptimize=ReleaseFast --summary all
      - name: Verify Ledger native command surface
        run: apps/ledger/scripts/release/command_surface_gate.sh zig-out/bin/ledger

  memory-note:
    needs: changes
    if: needs.changes.outputs.memory_note == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build memory-note
        run: zig build build-memory-note -Doptimize=ReleaseFast
      - name: Test memory-note
        run: zig build test-memory-note

  img:
    needs: changes
    if: needs.changes.outputs.img == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build img
        run: zig build build-img -Doptimize=ReleaseFast --summary all
      - name: Test img
        run: zig build test-img --summary all
