name: PR CI

on:
  pull_request:
    paths:
      - "build.zig"
      - "build.zig.zon"
      - "build/**"
      - "README.md"
      - "apps/**"
      - "libs/**"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/auto-release.yml"
      - "tools/durable_store_perf.zig"
      - "tools/install_guard.zig"
      - "tools/perf_hub.zig"
      - "tools/perf_contract.zig"
      - "tools/seq_replay_driver.zig"
      - "docs/release/**"
      - ".github/workflows/pr-ci.yml"

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      seq: ${{ steps.classify.outputs.seq }}
      lift: ${{ steps.classify.outputs.lift }}
      ledger: ${{ steps.classify.outputs.ledger }}
      memory_note: ${{ steps.classify.outputs.memory_note }}
      siwc: ${{ steps.classify.outputs.siwc }}
      perf: ${{ steps.classify.outputs.perf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed owners
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          declare -A selected=()
          while IFS= read -r app; do
            selected["$app"]=true
          done < <(.github/scripts/release_apps.sh ci-affected "$base" "$head")

          changed_paths="$(git diff --name-only "$base" "$head")"
          if grep -Fxq ".github/scripts/linux_fuzz_gate.sh" <<<"$changed_paths"; then
            selected[seq]=true
            selected[lift]=true
          fi

          for app in seq lift ledger memory-note siwc; do
            output_name="${app//-/_}"
            echo "${output_name}=${selected[$app]:-false}" >> "$GITHUB_OUTPUT"
          done

          perf=${selected[seq]:-false}
          if grep -Fxq 'build.zig' <<<"$changed_paths" ||
             grep -Fxq 'tools/perf_hub.zig' <<<"$changed_paths" ||
             grep -Fxq 'tools/perf_contract.zig' <<<"$changed_paths" ||
             grep -Fxq 'tools/seq_replay_driver.zig' <<<"$changed_paths" ||
             grep -Eq '^scripts/perf/' <<<"$changed_paths"; then
            perf=true
          fi
          echo "perf=$perf" >> "$GITHUB_OUTPUT"

  install-prefix-guard:
    needs: changes
    if: needs.changes.outputs.seq == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Verify cold and cached install destination admission
        run: scripts/test-install-prefix.sh

  release-contract:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release app classifier
        run: .github/scripts/test_release_apps.sh
      - name: Test Seq CI proof matrix
        run: .github/scripts/test_seq_ci_job.sh
      - name: Test Seq qualify-before-tag release transaction
        run: .github/scripts/test_seq_release_transaction.sh
      - name: Test Lift archive verifier
        run: .github/scripts/test_verify_lift_archive.sh
      - name: Require VERSION bumps for release-relevant CLI changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t affected < <(.github/scripts/release_apps.sh affected "$base" "$head")
          if [ "${#affected[@]}" -eq 0 ]; then
            echo "No release-relevant CLI surfaces changed."
            exit 0
          fi

          echo "Affected release apps: ${affected[*]}"
          missing=()
          for app in "${affected[@]}"; do
            if git diff --quiet "$base" "$head" -- "apps/$app/VERSION"; then
              missing+=("$app")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing VERSION bumps for release-relevant CLI changes: ${missing[*]}" >&2
            exit 1
          fi

  seq:
    needs: changes
    if: needs.changes.outputs.seq == 'true'
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Restore Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            .zig-cache-global
          key: zig-seq-${{ runner.os }}-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'apps/seq/**', 'libs/core/**', 'libs/definition_core/src/*', 'libs/definition_core/tests/*', 'libs/trace_core/src/*', 'libs/trace_core/tests/*', '.github/workflows/pr-ci.yml') }}
          restore-keys: |
            zig-seq-${{ runner.os }}-0.17.0-
      - name: Build seq integration surface
        run: zig build build-seq -Doptimize=fast --summary all
      - name: Test Seq 1.0 kernel and command surface
        run: zig build test-seq test-seq-core test-seq-cli-smoke -Doptimize=fast --summary all
      - name: Test definition core contracts
        run: zig build test-definition-core test-definition-core-guard -Doptimize=fast --summary all
      - name: Qualify opt-in Linux incremental compilation
        run: zig build test-definition-core -fincremental --summary all
      - name: Test trace core contracts
        run: zig build test-trace-core -Doptimize=fast --summary all
      - name: Test JSONL core contracts
        run: zig build test-jsonl-core --summary all
      - name: Test durable store contracts
        run: zig build test-durable-store --summary all
      - name: Test durable store performance contracts
        run: zig build test-durable-store-perf --summary all
      - name: Verify non-macOS seq command and capability admission
        run: apps/seq/scripts/release/command_surface_gate.sh zig-out/bin/seq

  seq-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.seq == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fuzz passive definition parsing (Linux)
        run: >-
          .github/scripts/linux_fuzz_gate.sh -- zig build test-definition-core
          -Doptimize=safe --fuzz=100K --summary all

  lift:
    needs: changes
    if: needs.changes.outputs.lift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build lift binaries
        run: zig build build-lift -Doptimize=fast
      - name: Test lift
        run: zig build test-lift

  lift-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.lift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fuzz lift bench_stats (Linux)
        run: >-
          .github/scripts/linux_fuzz_gate.sh -- zig build test-lift-bench-stats
          -Doptimize=safe --fuzz=100K --summary all

  full-suite-linux:
    needs: changes
    if: contains(needs.changes.outputs.*, 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install full-suite guard dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Qualify full suite on native Linux
        run: zig build test-full -Doptimize=debug -j2 --summary all

  build-all-linux:
    needs: changes
    if: contains(needs.changes.outputs.*, 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build and verify the surviving executable inventory
        run: |
          zig build -Doptimize=fast -j2 --summary all
          printf '%s\n' bench_stats ledger memory-note perf_hub seq siwc > expected-binaries.txt
          find zig-out/bin -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > actual-binaries.txt
          diff -u expected-binaries.txt actual-binaries.txt

  perf-hub:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Test performance hub
        run: zig build test-perf-hub

  ledger:
    needs: changes
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build ledger
        run: zig build build-ledger -Doptimize=fast
      - name: Test Ledger 1.0 kernel and command surface
        run: zig build test-ledger test-ledger-core test-ledger-cli-smoke -Doptimize=fast --summary all
      - name: Verify Ledger native command surface
        run: apps/ledger/scripts/release/command_surface_gate.sh zig-out/bin/ledger

  memory-note:
    needs: changes
    if: needs.changes.outputs.memory_note == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build memory-note
        run: zig build build-memory-note -Doptimize=fast
      - name: Test memory-note
        run: zig build test-memory-note
      - name: Verify memory-note selected layout and immutable migration
        run: bash apps/memory-note/scripts/test-cli.sh zig-out/bin/memory-note

  siwc:
    needs: changes
    if: needs.changes.outputs.siwc == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: macos-15
            target: aarch64-macos.15.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build SIWC release surface
        run: zig build build-siwc -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=fast
      - name: Test SIWC in Debug
        run: zig build test-siwc -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=debug
      - name: Test SIWC in ReleaseSafe
        run: zig build test-siwc -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=safe
      - name: Verify SIWC version and help
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < apps/siwc/VERSION)"
          test "$(zig-out/bin/siwc --version)" = "$expected"
          zig-out/bin/siwc --help

  windows:
    needs: changes
    if: contains(needs.changes.outputs.*, 'true')
    strategy:
      fail-fast: false
      matrix:
        app: [seq, lift, ledger, memory-note, siwc]
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build native Windows release executable
        run: zig build build-${{ matrix.app }} -Dtarget=x86_64-windows-gnu -Dcpu=baseline -Doptimize=fast -j2 --summary all
      - name: Test native Windows application in Debug
        run: zig build test-${{ matrix.app }} -Dtarget=x86_64-windows-gnu -Dcpu=baseline -Doptimize=debug -j2 --summary all
      - name: Test native Windows application in ReleaseSafe
        run: zig build test-${{ matrix.app }} -Dtarget=x86_64-windows-gnu -Dcpu=baseline -Doptimize=safe -j2 --summary all
