name: PR CI

on:
  pull_request:
    paths:
      - "build.zig"
      - "build.zig.zon"
      - "README.md"
      - "apps/seq/**"
      - "apps/lift/**"
      - "apps/cas/**"
      - "apps/cron/**"
      - "apps/learnings/**"
      - "apps/synesthesia/**"
      - "apps/ledger/**"
      - "apps/memory-note/**"
      - "apps/img/**"
      - "libs/core/**"
      - "libs/durable_store/**"
      - "libs/execution_policy_core/**"
      - "libs/retrace_core/**"
      - "testdata/hctp-v1/**"
      - ".github/scripts/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/auto-release.yml"
      - "scripts/perf/**"
      - "docs/release/**"
      - ".github/workflows/pr-ci.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      seq: ${{ steps.filter.outputs.seq }}
      lift: ${{ steps.filter.outputs.lift }}
      cas: ${{ steps.filter.outputs.cas }}
      cron: ${{ steps.filter.outputs.cron }}
      ledger: ${{ steps.filter.outputs.ledger }}
      memory_note: ${{ steps.filter.outputs.memory_note }}
      img: ${{ steps.filter.outputs.img }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seq:
              - "apps/seq/**"
              - "libs/durable_store/**"
              - "libs/execution_policy_core/**"
              - "libs/retrace_core/**"
              - "testdata/hctp-v1/**"
            lift:
              - "apps/lift/**"
            cas:
              - "apps/cas/**"
              - "libs/durable_store/**"
              - "libs/retrace_core/**"
              - "testdata/hctp-v1/**"
            cron:
              - "apps/cron/**"
            ledger:
              - "apps/ledger/**"
              - "apps/learnings/**"
              - "apps/synesthesia/**"
              - "libs/durable_store/**"
              - "libs/retrace_core/**"
              - "testdata/hctp-v1/**"
            memory_note:
              - "apps/memory-note/**"
            img:
              - "apps/img/**"
            core:
              - "build.zig"
              - "build.zig.zon"
              - "README.md"
              - "libs/core/**"
              - "libs/durable_store/**"
              - ".github/scripts/**"
              - ".github/workflows/pr-ci.yml"
              - ".github/workflows/release-*.yml"
              - ".github/workflows/auto-release.yml"
              - "scripts/perf/**"
              - "docs/release/**"

  install-prefix-guard:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.seq == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Root build rejects custom install prefix
        run: |
          set -euo pipefail
          if zig build build-seq -Doptimize=ReleaseFast --prefix "${RUNNER_TEMP}/skills-zig-prefix"; then
            echo "expected root build to reject a custom install prefix" >&2
            exit 1
          fi
      - name: Standalone seq build rejects custom install prefix
        working-directory: apps/seq
        run: |
          set -euo pipefail
          if zig build -Doptimize=ReleaseFast --prefix "${RUNNER_TEMP}/seq-prefix"; then
            echo "expected standalone seq build to reject a custom install prefix" >&2
            exit 1
          fi

  release-contract:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release app classifier
        run: .github/scripts/test_release_apps.sh
      - name: Test CAS archive verifier
        run: .github/scripts/test_verify_cas_archive.sh
      - name: Require VERSION bumps for release-relevant CLI changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t affected < <(.github/scripts/release_apps.sh affected "$base" "$head")
          if [ "${#affected[@]}" -eq 0 ]; then
            echo "No release-relevant CLI surfaces changed."
            exit 0
          fi

          echo "Affected release apps: ${affected[*]}"
          missing=()
          for app in "${affected[@]}"; do
            if git diff --quiet "$base" "$head" -- "apps/$app/VERSION"; then
              missing+=("$app")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing VERSION bumps for release-relevant CLI changes: ${missing[*]}" >&2
            exit 1
          fi

  seq:
    needs: changes
    if: needs.changes.outputs.seq == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Restore Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            .zig-cache-global
          key: zig-seq-${{ runner.os }}-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'apps/seq/**', 'libs/core/**', '.github/workflows/pr-ci.yml') }}
          restore-keys: |
            zig-seq-${{ runner.os }}-0.16.0-
      - name: Build seq
        run: zig build build-seq -Doptimize=ReleaseFast --summary all
      - name: Build standalone seq release surface
        working-directory: apps/seq
        run: zig build -Doptimize=ReleaseFast --summary all
      - name: Build standalone seq
        working-directory: apps/seq
        run: zig build -Doptimize=Debug --cache-dir ../../.zig-cache --global-cache-dir ../../.zig-cache-global --summary all
      - name: Test seq
        run: zig build test-seq --summary all
      - name: Verify non-macOS seq command and capability admission
        run: apps/seq/scripts/release/command_surface_gate.sh apps/seq/zig-out/bin/seq

  seq-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.seq == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/seq
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz seq (Linux)
        run: ../../.github/scripts/linux_fuzz_gate.sh -- zig test --dep core_path --dep core_cli --dep retrace_core -Mroot=src/tests.zig -Mcore_path=../../libs/core/src/path_helpers.zig -Mcore_cli=../../libs/core/src/cli_helpers.zig -Mretrace_core=../../libs/retrace_core/src/lib.zig -ffuzz --test-filter "fuzz "

  lift:
    needs: changes
    if: needs.changes.outputs.lift == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build lift binaries
        run: zig build build-lift -Doptimize=ReleaseFast
      - name: Test lift
        run: zig build test-lift

  lift-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.lift == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz lift bench_stats (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test --dep core_io --dep core_cli -Mroot=apps/lift/scripts/bench_stats.zig -Mcore_io=libs/core/src/io_helpers.zig -Mcore_cli=libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz "

  cas:
    needs: changes
    if: needs.changes.outputs.cas == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build cas binaries
        run: zig build build-cas -Doptimize=ReleaseFast
      - name: Verify packaged Linux CAS dispatcher layout
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/cas-release"
          archive="${RUNNER_TEMP}/cas-pr-linux-x86_64.tar.gz"
          mkdir -p "${package_dir}"
          cp zig-out/bin/cas "${package_dir}/cas"
          cp zig-out/bin/cas_account "${package_dir}/cas_account"
          cp zig-out/bin/cas_smoke_check "${package_dir}/cas_smoke_check"
          cp zig-out/bin/cas_smoke_check "${package_dir}/cas-smoke-check"
          cp zig-out/bin/cas_instance_runner "${package_dir}/cas_instance_runner"
          cp zig-out/bin/cas_instance_runner "${package_dir}/cas-instance-runner"
          cp zig-out/bin/cas_review_session "${package_dir}/cas_review_session"
          cp zig-out/bin/cas_review_session "${package_dir}/cas-review-session"
          cp zig-out/bin/cas_session_inquiry "${package_dir}/cas_session_inquiry"
          cp zig-out/bin/cas_session_inquiry "${package_dir}/cas-session-inquiry"
          cp zig-out/bin/cas_conformance_suite "${package_dir}/cas_conformance_suite"
          cp zig-out/bin/cas_conformance_suite "${package_dir}/cas-conformance-suite"
          cp zig-out/bin/cas_goal "${package_dir}/cas_goal"
          cp zig-out/bin/cas_goal "${package_dir}/cas-goal"
          cp zig-out/bin/cas-perf-budget-governor "${package_dir}/cas-perf-budget-governor"
          tar -czf "${archive}" -C "${package_dir}" .
          .github/scripts/verify_cas_archive.sh linux-x86_64 "${archive}"
      - name: Test generic CAS surfaces
        run: zig build test-cas

  cas-hctp-runtime-macos:
    needs: changes
    if: needs.changes.outputs.cas == 'true' || needs.changes.outputs.core == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test macOS CAS trial product and lifecycle laws
        run: zig build test-cas-trial test-cas-trial-macos-runtime -j1 --summary all
      - name: Test CAS archive verifier with macOS tar
        run: .github/scripts/test_verify_cas_archive.sh

  hctp-product-macos:
    needs: changes
    if: needs.changes.outputs.seq == 'true' || needs.changes.outputs.cas == 'true' || needs.changes.outputs.ledger == 'true' || needs.changes.outputs.core == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Test macOS HCTP product and operator-recipe conformance
        run: zig build test-hylo test-hctp-conformance -j1 --summary all
      - name: Test sealed commitments after the operator-recipe aggregate
        run: zig build test-hctp-sealed-commitments --summary all
      - name: Verify macOS seq command and capability admission
        run: |
          (cd apps/seq && zig build -Doptimize=ReleaseFast --summary all)
          apps/seq/scripts/release/command_surface_gate.sh apps/seq/zig-out/bin/seq
          zig build test-hylo-operator-recipe-seq-release-runtime \
            -Dhylo-operator-seq-path="${PWD}/apps/seq/zig-out/bin/seq" \
            --summary all
      - name: Build ReleaseFast Hylo operator binaries
        run: zig build build-cas build-ledger -Doptimize=ReleaseFast -j1 --summary all
      - name: Check out trusted Hylo operator documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tkersey/dotfiles
          ref: main
          path: dotfiles
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Log native and documentation revisions
        run: |
          set -euo pipefail
          echo "skills-zig=$(git rev-parse HEAD)"
          echo "dotfiles=$(git -C dotfiles rev-parse HEAD)"
      - name: Verify the dotfiles operator contract against the native manifest
        working-directory: dotfiles
        env:
          HYLO_OPERATOR_SURFACE_MANIFEST: ${{ github.workspace }}/testdata/hctp-v1/operator-recipe/operator-surface-manifest.json
        run: uv run python codex/skills/hylo/tests/test_operator_recipe_contract.py
      - name: Probe the live ReleaseFast Hylo operator surface
        working-directory: dotfiles
        run: |
          uv run python codex/skills/hylo/scripts/check-operator-surface \
            --mode operator \
            --surface-manifest "${GITHUB_WORKSPACE}/testdata/hctp-v1/operator-recipe/operator-surface-manifest.json" \
            --seq "${GITHUB_WORKSPACE}/apps/seq/zig-out/bin/seq" \
            --ledger "${GITHUB_WORKSPACE}/zig-out/bin/ledger" \
            --cas "${GITHUB_WORKSPACE}/zig-out/bin/cas" \
            --json

  cas-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.cas == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz CAS budget governor (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test --dep core_json --dep core_io --dep core_cli -Mroot=apps/cas/scripts/budget_governor.zig -Mcore_json=libs/core/src/json_helpers.zig -Mcore_io=libs/core/src/io_helpers.zig -Mcore_cli=libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz governor"

  cron:
    needs: changes
    if: needs.changes.outputs.cron == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build cron binaries
        run: zig build build-cron -Doptimize=ReleaseFast
      - name: Test cron
        run: zig build test-cron

  ledger:
    needs: changes
    if: needs.changes.outputs.ledger == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build ledger
        run: zig build build-ledger -Doptimize=ReleaseFast
      - name: Test generic ledger and portable validators
        run: zig build test-ledger test-retrace-core test-learnings test-append-learning test-synesthesia test-hylo-operator-recipe --summary all

  memory-note:
    needs: changes
    if: needs.changes.outputs.memory_note == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build memory-note
        run: zig build build-memory-note -Doptimize=ReleaseFast
      - name: Test memory-note
        run: zig build test-memory-note

  img:
    needs: changes
    if: needs.changes.outputs.img == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build img
        run: zig build build-img -Doptimize=ReleaseFast --summary all
      - name: Test img
        run: zig build test-img --summary all
