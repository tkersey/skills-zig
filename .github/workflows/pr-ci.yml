name: PR CI

on:
  pull_request:
    paths:
      - "build.zig"
      - "build.zig.zon"
      - "README.md"
      - "apps/seq/**"
      - "apps/lift/**"
      - "apps/cas/**"
      - "apps/cron/**"
      - "apps/puff/**"
      - "apps/learnings/**"
      - "apps/ledger/**"
      - "apps/memory-note/**"
      - "apps/resolve-c3/**"
      - "apps/mesh/**"
      - "apps/st/**"
      - "apps/parse-arch/**"
      - "libs/core/**"
      - "libs/durable_store/**"
      - ".github/scripts/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/auto-release.yml"
      - "scripts/perf/**"
      - "docs/release/**"
      - ".github/workflows/pr-ci.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      seq: ${{ steps.filter.outputs.seq }}
      lift: ${{ steps.filter.outputs.lift }}
      cas: ${{ steps.filter.outputs.cas }}
      cron: ${{ steps.filter.outputs.cron }}
      puff: ${{ steps.filter.outputs.puff }}
      learnings: ${{ steps.filter.outputs.learnings }}
      ledger: ${{ steps.filter.outputs.ledger }}
      memory_note: ${{ steps.filter.outputs.memory_note }}
      resolve_c3: ${{ steps.filter.outputs.resolve_c3 }}
      mesh: ${{ steps.filter.outputs.mesh }}
      st: ${{ steps.filter.outputs.st }}
      parse_arch: ${{ steps.filter.outputs.parse_arch }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seq:
              - "apps/seq/**"
            lift:
              - "apps/lift/**"
            cas:
              - "apps/cas/**"
            cron:
              - "apps/cron/**"
            puff:
              - "apps/puff/**"
            learnings:
              - "apps/learnings/**"
            ledger:
              - "apps/ledger/**"
            memory_note:
              - "apps/memory-note/**"
            resolve_c3:
              - "apps/resolve-c3/**"
            mesh:
              - "apps/mesh/**"
            st:
              - "apps/st/**"
            parse_arch:
              - "apps/parse-arch/**"
            core:
              - "build.zig"
              - "build.zig.zon"
              - "README.md"
              - "libs/core/**"
              - "libs/durable_store/**"
              - ".github/scripts/**"
              - ".github/workflows/pr-ci.yml"
              - ".github/workflows/release-*.yml"
              - ".github/workflows/auto-release.yml"
              - "scripts/perf/**"
              - "docs/release/**"

  install-prefix-guard:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.seq == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Root build rejects custom install prefix
        run: |
          set -euo pipefail
          if zig build build-st -Doptimize=ReleaseFast --prefix "${RUNNER_TEMP}/skills-zig-prefix"; then
            echo "expected root build to reject a custom install prefix" >&2
            exit 1
          fi
      - name: Standalone seq build rejects custom install prefix
        working-directory: apps/seq
        run: |
          set -euo pipefail
          if zig build -Doptimize=ReleaseFast --prefix "${RUNNER_TEMP}/seq-prefix"; then
            echo "expected standalone seq build to reject a custom install prefix" >&2
            exit 1
          fi

  release-contract:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require VERSION bumps for release-relevant CLI changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t affected < <(.github/scripts/release_apps.sh affected "$base" "$head")
          if [ "${#affected[@]}" -eq 0 ]; then
            echo "No release-relevant CLI surfaces changed."
            exit 0
          fi

          echo "Affected release apps: ${affected[*]}"
          missing=()
          for app in "${affected[@]}"; do
            if git diff --quiet "$base" "$head" -- "apps/$app/VERSION"; then
              missing+=("$app")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing VERSION bumps for release-relevant CLI changes: ${missing[*]}" >&2
            exit 1
          fi

  seq:
    needs: changes
    if: needs.changes.outputs.seq == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Restore Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            .zig-cache-global
          key: zig-seq-${{ runner.os }}-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'apps/seq/**', 'libs/core/**', '.github/workflows/pr-ci.yml') }}
          restore-keys: |
            zig-seq-${{ runner.os }}-0.16.0-
      - name: Build seq
        run: zig build build-seq -Doptimize=ReleaseFast --summary all
      - name: Build standalone seq
        working-directory: apps/seq
        run: zig build -Doptimize=Debug --cache-dir ../../.zig-cache --global-cache-dir ../../.zig-cache-global --summary all
      - name: Test seq
        run: zig build test-seq --summary all

  seq-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.seq == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/seq
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz seq (Linux)
        run: ../../.github/scripts/linux_fuzz_gate.sh -- zig test --dep core_path --dep core_cli --dep retrace_core -Mroot=src/tests.zig -Mcore_path=../../libs/core/src/path_helpers.zig -Mcore_cli=../../libs/core/src/cli_helpers.zig -Mretrace_core=../../libs/retrace_core/src/lib.zig -ffuzz --test-filter "fuzz "

  lift:
    needs: changes
    if: needs.changes.outputs.lift == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build lift binaries
        run: zig build build-lift -Doptimize=ReleaseFast
      - name: Test lift
        run: zig build test-lift

  lift-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.lift == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz lift bench_stats (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test --dep core_io --dep core_cli -Mroot=apps/lift/scripts/bench_stats.zig -Mcore_io=libs/core/src/io_helpers.zig -Mcore_cli=libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz "

  cas:
    needs: changes
    if: needs.changes.outputs.cas == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build cas binaries
        run: zig build build-cas -Doptimize=ReleaseFast
      - name: Test CAS budget governor
        run: zig build test-cas

  cas-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.cas == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fuzz CAS budget governor (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test --dep core_json --dep core_io --dep core_cli -Mroot=apps/cas/scripts/budget_governor.zig -Mcore_json=libs/core/src/json_helpers.zig -Mcore_io=libs/core/src/io_helpers.zig -Mcore_cli=libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz governor"

  cron:
    needs: changes
    if: needs.changes.outputs.cron == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build cron binaries
        run: zig build build-cron -Doptimize=ReleaseFast
      - name: Test cron
        run: zig build test-cron

  puff:
    needs: changes
    if: needs.changes.outputs.puff == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build puff binaries
        run: zig build build-puff -Doptimize=ReleaseFast

  learnings:
    needs: changes
    if: needs.changes.outputs.learnings == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build learnings binaries
        run: zig build build-learnings -Doptimize=ReleaseFast
      - name: Test learnings
        run: zig build test-learnings
      - name: Test append_learning
        run: zig build test-append-learning

  ledger:
    needs: changes
    if: needs.changes.outputs.ledger == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build ledger
        run: zig build build-ledger -Doptimize=ReleaseFast
      - name: Test ledger
        run: zig build test-ledger

  memory-note:
    needs: changes
    if: needs.changes.outputs.memory_note == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build memory-note
        run: zig build build-memory-note -Doptimize=ReleaseFast
      - name: Test memory-note
        run: zig build test-memory-note

  resolve-c3:
    needs: changes
    if: needs.changes.outputs.resolve_c3 == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build resolve-c3
        run: zig build build-resolve-c3 -Doptimize=ReleaseFast
      - name: Test resolve-c3
        run: zig build test-resolve-c3

  st:
    needs: changes
    if: needs.changes.outputs.st == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build st
        run: zig build build-st -Doptimize=ReleaseFast
      - name: Test st
        run: zig build test-st

  mesh:
    needs: changes
    if: needs.changes.outputs.mesh == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build mesh
        run: zig build build-mesh -Doptimize=ReleaseFast
      - name: Test mesh
        run: zig build test-mesh

  parse-arch:
    needs: changes
    if: needs.changes.outputs.parse_arch == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build parse-arch
        run: zig build build-parse-arch -Doptimize=ReleaseFast
      - name: Test parse-arch
        run: zig build test-parse-arch
