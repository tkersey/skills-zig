name: PR CI

on:
  pull_request:
    paths:
      - "build.zig"
      - "build.zig.zon"
      - "README.md"
      - "apps/seq/**"
      - "apps/lift/**"
      - "apps/cas/**"
      - "apps/cron/**"
      - "apps/puff/**"
      - "apps/learnings/**"
      - "apps/mesh/**"
      - "apps/st/**"
      - "libs/core/**"
      - ".github/scripts/**"
      - ".github/workflows/release-*.yml"
      - "scripts/perf/**"
      - "docs/release/**"
      - ".github/workflows/pr-ci.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      seq: ${{ steps.filter.outputs.seq }}
      lift: ${{ steps.filter.outputs.lift }}
      cas: ${{ steps.filter.outputs.cas }}
      cron: ${{ steps.filter.outputs.cron }}
      puff: ${{ steps.filter.outputs.puff }}
      learnings: ${{ steps.filter.outputs.learnings }}
      mesh: ${{ steps.filter.outputs.mesh }}
      st: ${{ steps.filter.outputs.st }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seq:
              - "apps/seq/**"
            lift:
              - "apps/lift/**"
            cas:
              - "apps/cas/**"
            cron:
              - "apps/cron/**"
            puff:
              - "apps/puff/**"
            learnings:
              - "apps/learnings/**"
            mesh:
              - "apps/mesh/**"
            st:
              - "apps/st/**"
            core:
              - "build.zig"
              - "build.zig.zon"
              - "README.md"
              - "libs/core/**"
              - ".github/scripts/**"
              - ".github/workflows/release-*.yml"
              - "scripts/perf/**"
              - "docs/release/**"

  seq:
    needs: changes
    if: needs.changes.outputs.seq == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/seq
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build seq
        run: zig build -Doptimize=ReleaseFast
      - name: Test seq
        run: zig build test
      - name: Parser perf gate
        run: bash scripts/perf/parser_gate.sh

  seq-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.seq == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/seq
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Fuzz seq (Linux)
        run: ../../.github/scripts/linux_fuzz_gate.sh -- zig test --dep core_path --dep core_cli -Mroot=src/tests.zig -Mcore_path=../../libs/core/src/path_helpers.zig -Mcore_cli=../../libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz "

  lift:
    needs: changes
    if: needs.changes.outputs.lift == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build lift binaries
        run: zig build build-lift -Doptimize=ReleaseFast
      - name: Test lift
        run: zig build test-lift
      - name: Lift bench_stats perf gate
        run: bash apps/lift/scripts/perf/bench_stats_gate.sh

  lift-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.lift == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Fuzz lift bench_stats (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test --dep core_io --dep core_cli -Mroot=apps/lift/scripts/bench_stats.zig -Mcore_io=libs/core/src/io_helpers.zig -Mcore_cli=libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz "

  cas:
    needs: changes
    if: needs.changes.outputs.cas == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build cas binaries
        run: zig build build-cas -Doptimize=ReleaseFast
      - name: Test CAS budget governor
        run: zig build test-cas
      - name: CAS budget governor perf gate
        run: bash apps/cas/scripts/perf/budget_governor_gate.sh

  cas-fuzz-linux:
    needs: changes
    if: needs.changes.outputs.cas == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Fuzz CAS budget governor (Linux)
        run: .github/scripts/linux_fuzz_gate.sh -- zig test --dep core_json --dep core_io --dep core_cli -Mroot=apps/cas/scripts/budget_governor.zig -Mcore_json=libs/core/src/json_helpers.zig -Mcore_io=libs/core/src/io_helpers.zig -Mcore_cli=libs/core/src/cli_helpers.zig -ffuzz --test-filter "fuzz governor"

  cron:
    needs: changes
    if: needs.changes.outputs.cron == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build cron binaries
        run: zig build build-cron -Doptimize=ReleaseFast
      - name: Test cron
        run: zig build test-cron

  puff:
    needs: changes
    if: needs.changes.outputs.puff == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build puff binaries
        run: zig build build-puff -Doptimize=ReleaseFast

  learnings:
    needs: changes
    if: needs.changes.outputs.learnings == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build learnings binaries
        run: zig build build-learnings -Doptimize=ReleaseFast
      - name: Test learnings
        run: zig build test-learnings
      - name: Test append_learning
        run: zig build test-append-learning

  st:
    needs: changes
    if: needs.changes.outputs.st == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build st
        run: zig build build-st -Doptimize=ReleaseFast
      - name: Test st
        run: zig build test-st

  mesh:
    needs: changes
    if: needs.changes.outputs.mesh == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build mesh
        run: zig build build-mesh -Doptimize=ReleaseFast
      - name: Test mesh
        run: zig build test-mesh
