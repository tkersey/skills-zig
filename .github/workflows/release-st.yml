name: Release st

on:
  push:
    tags:
      - "st-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: release-st-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs_on: ubuntu-latest
            zig_archive: zig-x86_64-linux-0.15.2.tar.xz
          - target: darwin-arm64
            runs_on: macos-14
            zig_archive: zig-aarch64-macos-0.15.2.tar.xz
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate st tag matches VERSION
        run: |
          expected_tag="st-v$(tr -d '[:space:]' < apps/st/VERSION)"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Install Zig 0.15.2
        run: |
          set -euo pipefail
          archive="${{ matrix.zig_archive }}"
          curl -fsSLO "https://ziglang.org/download/0.15.2/${archive}"
          tar -xf "${archive}"
          zig_dir="${archive%.tar.xz}"
          echo "${PWD}/${zig_dir}" >> "$GITHUB_PATH"
      - name: Build st binary
        run: zig build build-st -Doptimize=ReleaseFast
      - name: Package st artifact
        run: |
          TAR_NAME="${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/st
          cp zig-out/bin/st dist/st/st
          tar -czf "${TAR_NAME}" -C dist/st st
      - name: Upload st workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download st release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "${RELEASE_TAG}-*.tar.gz"
      - name: Verify st artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish st release assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -name '*.tar.gz' -print0 | sort -z)
          if gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${RELEASE_TAG}"
          fi
