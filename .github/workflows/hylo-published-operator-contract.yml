name: Hylo published operator contract

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hylo-published-operator-contract.yml"
      - "build.zig"
      - "build.zig.zon"
      - "apps/seq/**"
      - "apps/cas/**"
      - "apps/ledger/**"
      - "libs/core/**"
      - "libs/durable_store/**"
      - "libs/execution_policy_core/**"
      - "libs/retrace_core/**"
      - "testdata/hctp-v1/**"
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hylo-published-operator-contract
  cancel-in-progress: true

jobs:
  published-operator-contract:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out published native surface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build published native operator surface
        run: >-
          zig build build-seq build-ledger build-cas
          -Doptimize=ReleaseFast -j1 --summary all

      - name: Execute published native operator recipe
        run: >-
          zig build test-hylo-operator-recipe
          test-hylo-operator-recipe-executable
          -j1 --summary all

      - name: Check out published Hylo operator documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tkersey/dotfiles
          ref: main
          path: dotfiles
          persist-credentials: false

      - name: Report published compatibility tuple
        shell: bash
        run: |
          set -euo pipefail
          native_commit="$(git rev-parse HEAD)"
          dotfiles_commit="$(git -C dotfiles rev-parse HEAD)"
          printf 'skills-zig=%s\n' "$native_commit"
          printf 'dotfiles=%s\n' "$dotfiles_commit"
          printf '%s\n' \
            "- skills-zig: \`$native_commit\`" \
            "- dotfiles: \`$dotfiles_commit\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published documentation contract against native manifest
        working-directory: dotfiles
        env:
          HYLO_OPERATOR_SURFACE_MANIFEST: ${{ github.workspace }}/testdata/hctp-v1/operator-recipe/operator-surface-manifest.json
        run: uv run python codex/skills/hylo/tests/test_operator_recipe_contract.py

      - name: Probe published native operator surface
        working-directory: dotfiles
        run: |
          uv run python codex/skills/hylo/scripts/check-operator-surface \
            --mode operator \
            --surface-manifest "${GITHUB_WORKSPACE}/testdata/hctp-v1/operator-recipe/operator-surface-manifest.json" \
            --seq "${GITHUB_WORKSPACE}/zig-out/bin/seq" \
            --ledger "${GITHUB_WORKSPACE}/zig-out/bin/ledger" \
            --cas "${GITHUB_WORKSPACE}/zig-out/bin/cas" \
            --json
