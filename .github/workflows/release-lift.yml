name: Release lift

on:
  push:
    tags:
      - "lift-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-lift-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs_on: ubuntu-latest
          - target: darwin-arm64
            runs_on: macos-14
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate tag matches apps/lift/VERSION
        run: |
          expected_tag="lift-v$(tr -d '[:space:]' < apps/lift/VERSION)"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag/version mismatch: got ${RELEASE_TAG}, expected ${expected_tag}" >&2
            exit 1
          fi
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build lift binaries
        run: zig build build-lift -Doptimize=ReleaseFast
      - name: Package lift artifact
        run: |
          mkdir -p dist/lift
          cp zig-out/bin/bench_stats dist/lift/lift-bench-stats
          cp zig-out/bin/perf_report dist/lift/lift-perf-report
          cp zig-out/bin/lift-perf-bench-stats dist/lift/lift-perf-bench-stats
          TAR_NAME="${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "${TAR_NAME}" -C dist/lift .
      - name: Upload lift workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
          path: ${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download lift release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.RELEASE_TAG }}-*.tar.gz
          path: release-assets
          merge-multiple: true
      - name: Verify lift artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish lift release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: release-assets/*.tar.gz
