name: Release learnings

on:
  push:
    tags:
      - "learnings-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate learnings tag matches VERSION
        run: |
          expected_tag="learnings-v$(tr -d '[:space:]' < apps/learnings/VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build learnings binaries
        run: zig build build-learnings -Doptimize=ReleaseFast
      - name: Package learnings artifact
        run: |
          TAR_NAME="${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/learnings
          cp zig-out/bin/learnings dist/learnings/learnings
          cp zig-out/bin/append_learning dist/learnings/append_learning
          tar -czf "${TAR_NAME}" -C dist/learnings .
      - name: Upload learnings workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
      - name: Publish learnings release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TAR_NAME }}
