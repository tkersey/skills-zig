name: Release resolve-c3

on:
  push:
    tags:
      - "resolve-c3-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: release-resolve-c3-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs_on: ubuntu-latest
            zig_archive: zig-x86_64-linux-0.16.0.tar.xz
          - target: darwin-arm64
            runs_on: macos-14
            zig_archive: zig-aarch64-macos-0.16.0.tar.xz
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate resolve-c3 tag matches VERSION
        run: |
          expected_tag="resolve-c3-v$(tr -d '[:space:]' < apps/resolve-c3/VERSION)"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          archive="${{ matrix.zig_archive }}"
          curl -fsSLO "https://ziglang.org/download/0.16.0/${archive}"
          tar -xf "${archive}"
          zig_dir="${archive%.tar.xz}"
          echo "${PWD}/${zig_dir}" >> "$GITHUB_PATH"
      - name: Build resolve-c3 binary
        run: zig build build-resolve-c3 -Doptimize=ReleaseFast
      - name: Test resolve-c3
        run: zig build test-resolve-c3
      - name: Package resolve-c3 artifact
        run: |
          TAR_NAME="${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/resolve-c3
          cp zig-out/bin/resolve-c3 dist/resolve-c3/resolve-c3
          tar -czf "${TAR_NAME}" -C dist/resolve-c3 resolve-c3
      - name: Upload resolve-c3 workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download resolve-c3 release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "${RELEASE_TAG}-*.tar.gz"
      - name: Verify resolve-c3 artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish resolve-c3 release assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -name '*.tar.gz' -print0 | sort -z)
          if gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${RELEASE_TAG}"
          fi
