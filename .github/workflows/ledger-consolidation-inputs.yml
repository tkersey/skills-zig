name: Apply verified Ledger consolidation
on:
  push:
    branches: [codex/ledger-directed-relations]
    paths: [.github/workflows/ledger-consolidation-inputs.yml, .github/ledger-consolidation.patch.gz.b64]
permissions:
  contents: write
jobs:
  consolidate:
    if: github.ref == 'refs/heads/codex/ledger-directed-relations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the tested resolution and retain both parents
        shell: bash
        run: |
          set -euo pipefail
          source_parent=8fcd7f4c8ce0e2ed86bd8bc7d0634ce9f6f43558
          git fetch --no-tags origin "$source_parent"
          base64 --decode .github/ledger-consolidation.patch.gz.b64 | gzip -dc > "$RUNNER_TEMP/consolidation.patch"
          printf '%s  %s\n' e86139b2bf31dfc87a0188f37c46f1db7e7ebad59261855564a4adafe7141743 "$RUNNER_TEMP/consolidation.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/consolidation.patch"
          git apply --index "$RUNNER_TEMP/consolidation.patch"
          git rm .github/ledger-consolidation.patch.gz.b64 .github/workflows/ledger-consolidation-inputs.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n\n%s\n\n%s\n' 'Merge PR #115 into the consolidated Ledger relation change' 'Retain #116 definition syntax and relation semantics; incorporate #115 fold construction, checkpoint validation order, allocation-failure coverage, arena relocation and opaque-number regressions.' 'Both source parents are preserved. The exact resolution passed 185 Ledger tests, 38 segmented tests and all 16 Ergon acceptance tests in a local ReleaseSafe build. No main-branch merge or release is performed.' | git commit-tree "$tree" -p "$GITHUB_SHA" -p "$source_parent")
          git push origin "$commit":refs/heads/codex/ledger-directed-relations
