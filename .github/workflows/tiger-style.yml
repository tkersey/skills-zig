name: TigerStyle

on:
  pull_request:
    paths:
      - "**/*.zig"
      - "CONTRIBUTING.md"
      - "docs/engineering/TIGER_STYLE.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/auto-release.yml"
      - ".github/workflows/pr-ci.yml"
      - ".github/workflows/tiger-style.yml"

permissions:
  contents: read

jobs:
  tiger-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test the TigerStyle auditor
        run: zig test tools/tiger_style/main.zig
      - name: Audit repository mappings
        run: zig run tools/tiger_style/main.zig -- audit-repository
      - name: Check formatting of changed Zig files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' changed_file; do
            zig fmt --check "$changed_file"
          done < <(
            git diff --name-only -z --diff-filter=ACMR \
              "$BASE_SHA" "$HEAD_SHA" -- '*.zig'
          )
      - name: Audit changed Zig code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          zig run tools/tiger_style/main.zig -- audit-diff \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
