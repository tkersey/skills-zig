name: TigerStyle

on:
  pull_request:
    paths:
      - "**/*.zig"
      - "CONTRIBUTING.md"
      - "docs/engineering/TIGER_STYLE.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/auto-release.yml"
      - ".github/workflows/pr-ci.yml"
      - ".github/workflows/tiger-style.yml"

permissions:
  contents: read

jobs:
  tiger-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test the TigerStyle auditor
        run: zig test tools/tiger_style/main.zig
      - name: Audit repository mappings
        run: zig run tools/tiger_style/main.zig -- audit-repository
      - name: Check formatting of all tracked Zig files
        run: |
          set -euo pipefail
          git ls-files -z '*.zig' | xargs -0 zig fmt --check
      - name: Audit all tracked Zig code
        run: |
          set -euo pipefail
          git ls-files -z '*.zig' |
            xargs -0 zig run tools/tiger_style/main.zig -- audit-files
