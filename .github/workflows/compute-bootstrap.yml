name: Compute Linux development inputs

on:
  pull_request:
    paths:
      - .github/workflows/compute-bootstrap.yml

permissions:
  contents: read

jobs:
  inputs:
    if: github.head_ref == 'codex/compute-cli'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install container build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils unzip
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare authenticated compiler and source inputs
        env:
          ZIG_GLOBAL_CACHE_DIR: /tmp/compute-cache
        run: |
          set -euo pipefail
          mkdir -p /tmp/compute-inputs "$ZIG_GLOBAL_CACHE_DIR"
          git -c safe.directory="$PWD" archive HEAD > /tmp/compute-inputs/skills-zig.tar
          git -c safe.directory="$PWD" rev-parse HEAD > /tmp/compute-inputs/skills-zig.commit
          cd /tmp
          curl -fsSLo zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo '1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz' | sha256sum -c -
          tar -xf zig.tar.xz
          cp zig.tar.xz /tmp/compute-inputs/
          zig=/tmp/zig-x86_64-linux-0.17.0/zig
          "$zig" version
          test "$("$zig" fetch 'git+https://github.com/tkersey/kosmos#fc6a5606421d6b6c65bc93f2a4847e41dc52711c')" = 'kosmos-7.0.0-vcJNB2-JDQAFtoFQV7jWwlCae5cB8DRjGJcBlKRqwK0e'
          test "$("$zig" fetch 'git+https://github.com/tkersey/horos#bacdcaada3f09b1cbc4e787a45ba300d5fdbcb99')" = 'horos-4.0.0-flclaN-lOAC7YPSXxv0UqCmKSuXATnz4gEC-89VXksqw'
          test "$("$zig" fetch 'git+https://github.com/kurtwagner/zlinter#4937a301d9bc06e013cf2f9fb3ee1fdc8793df1f')" = 'zlinter-0.0.1-OjQ08YxkFQBQNP_aoK_07mQdcOfv6eho-IPexfuOC4eh'
          test "$("$zig" fetch 'git+https://codeberg.org/ziglang/translate-c#02ff0c523fb92a38939b04d0145c4a9602a74d56')" = 'translate_c-2.0.0-Q_BUWltOBwBYABF84EUL208pIFeUIwbBs29FmVBaafN5'
          cd "$GITHUB_WORKSPACE"
          "$zig" build --help > /tmp/compute-inputs/build-help.txt
          tar -czf /tmp/compute-inputs/package-cache.tar.gz -C "$ZIG_GLOBAL_CACHE_DIR" p
          cd /tmp/compute-inputs
          sha256sum skills-zig.tar zig.tar.xz package-cache.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: compute-linux-development-inputs
          path: /tmp/compute-inputs/
          if-no-files-found: error
          # Temporary editor inputs only; remove this workflow from the final PR.
          retention-days: 3
          compression-level: 0
