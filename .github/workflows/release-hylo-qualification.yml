name: Hylo Qualification

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact ref to check out and qualify
        required: true
        type: string
      expected_sha:
        description: Commit SHA the checked-out ref must resolve to
        required: true
        type: string
      expected_caller_ref:
        description: Caller ref required for a release invocation
        required: false
        default: ""
        type: string
      qualification_run_id:
        description: Trusted Auto Release run whose exact-SHA receipt may be reused
        required: false
        default: ""
        type: string
  schedule:
    - cron: "43 10 * * 1"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Ref to qualify; defaults to the dispatched workflow commit
        required: false
        type: string
      expected_sha:
        description: Optional commit SHA the ref must resolve to
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bind:
    if: inputs.qualification_run_id == null || inputs.qualification_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.bind.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - id: bind
        name: Bind qualification to the checked-out commit
        shell: bash
        env:
          EXPECTED_CALLER_REF: ${{ inputs.expected_caller_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "sha=${actual_sha}" >> "$GITHUB_OUTPUT"

          if [ -n "${EXPECTED_CALLER_REF}" ] && [ "${GITHUB_REF}" != "${EXPECTED_CALLER_REF}" ]; then
            echo "Qualification caller ref mismatch: got ${GITHUB_REF}, expected ${EXPECTED_CALLER_REF}" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_SHA}" ] && [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Qualification SHA mismatch: got ${actual_sha}, expected ${EXPECTED_SHA}" >&2
            exit 1
          fi

  qualify:
    needs: bind
    runs-on: macos-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            timeout_minutes: 7
          - shard: memory
            timeout_minutes: 5
          - shard: persistent
            timeout_minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.bind.outputs.sha }}
          persist-credentials: false

      - name: Rebind shard to the qualified commit
        shell: bash
        env:
          QUALIFIED_SHA: ${{ needs.bind.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${QUALIFIED_SHA}" ]; then
            echo "Qualification shard SHA mismatch: got ${actual_sha}, expected ${QUALIFIED_SHA}" >&2
            exit 1
          fi

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Run Hylo qualification shard
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
        run: zig build test-hylo-qualification-${{ matrix.shard }} -Doptimize=ReleaseSafe -j2 --summary all

  receipt:
    if: >-
      always() &&
      (inputs.qualification_run_id == null || inputs.qualification_run_id == '') &&
      needs.bind.result == 'success'
    needs: [bind, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record exact-SHA qualification receipt
        shell: bash
        env:
          QUALIFIED_SHA: ${{ needs.bind.outputs.sha }}
          RESULT: ${{ needs.qualify.result }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg qualified_sha "$QUALIFIED_SHA" \
            --arg result "$RESULT" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{
              schema: "hylo-qualification-receipt/v1",
              repository: $repository,
              qualified_sha: $qualified_sha,
              result: $result,
              run_id: $run_id,
              command: "zig build test-hylo-qualification-{core,memory,persistent} -Doptimize=ReleaseSafe -j2 --summary all; isolated matrix"
            }' > hylo-qualification-receipt.json

          printf -- '- SHA: %s\n- Result: %s\n- Run: %s/%s/actions/runs/%s\n' \
            "$QUALIFIED_SHA" "$RESULT" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-SHA qualification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hylo-qualification-${{ needs.bind.outputs.sha }}
          path: hylo-qualification-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  verify:
    if: inputs.qualification_run_id != null && inputs.qualification_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Verify trusted exact-SHA qualification receipt
        shell: bash
        env:
          EXPECTED_CALLER_REF: ${{ inputs.expected_caller_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "${QUALIFICATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid qualification run id: ${QUALIFICATION_RUN_ID}" >&2
            exit 1
          fi
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "Receipt verification requires an expected SHA" >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Qualification SHA mismatch: got ${actual_sha}, expected ${EXPECTED_SHA}" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_CALLER_REF}" ] && [ "${GITHUB_REF}" != "${EXPECTED_CALLER_REF}" ]; then
            echo "Qualification caller ref mismatch: got ${GITHUB_REF}, expected ${EXPECTED_CALLER_REF}" >&2
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}")"
          # shellcheck disable=SC2016
          jq -e \
            --arg expected_sha "${EXPECTED_SHA}" \
            '.path == ".github/workflows/auto-release.yml" and
             .event == "push" and
             .head_branch == "main" and
             .head_sha == $expected_sha' \
            <<<"${run_json}" >/dev/null

          mkdir -p qualification-receipt
          gh run download "${QUALIFICATION_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "hylo-qualification-${EXPECTED_SHA}" \
            --dir qualification-receipt

          mapfile -t receipts < <(find qualification-receipt -type f -name hylo-qualification-receipt.json)
          if [ "${#receipts[@]}" -ne 1 ]; then
            echo "Expected one qualification receipt, got ${#receipts[@]}" >&2
            exit 1
          fi

          # shellcheck disable=SC2016
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg expected_sha "${EXPECTED_SHA}" \
            --arg run_id "${QUALIFICATION_RUN_ID}" \
            '(keys | sort) == ([
                "command",
                "qualified_sha",
                "repository",
                "result",
                "run_id",
                "schema"
              ] | sort) and
             .schema == "hylo-qualification-receipt/v1" and
             .repository == $repository and
             .qualified_sha == $expected_sha and
             .result == "success" and
             .run_id == $run_id and
             .command == "zig build test-hylo-qualification-{core,memory,persistent} -Doptimize=ReleaseSafe -j2 --summary all; isolated matrix"' \
            "${receipts[0]}" >/dev/null

          printf -- '- Reused qualification: %s/%s/actions/runs/%s\n- SHA: %s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$QUALIFICATION_RUN_ID" "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
