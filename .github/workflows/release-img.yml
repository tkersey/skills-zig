name: Release img

on:
  push:
    tags:
      - "img-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-img-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs_on: ubuntu-latest
            zig_archive: zig-x86_64-linux-0.16.0.tar.xz
          - target: darwin-arm64
            runs_on: macos-14
            zig_archive: zig-aarch64-macos-0.16.0.tar.xz
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate img tag matches VERSION
        run: |
          set -euo pipefail
          expected_tag="img-v$(tr -d '[:space:]' < apps/img/VERSION)"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          archive="${{ matrix.zig_archive }}"
          curl -fsSLO "https://ziglang.org/download/0.16.0/${archive}"
          tar -xf "${archive}"
          zig_dir="${archive%.tar.xz}"
          echo "${PWD}/${zig_dir}" >> "$GITHUB_PATH"
      - name: Build img
        run: zig build build-img -Doptimize=ReleaseFast --summary all
      - name: Test img
        run: zig build test-img --summary all
      - name: Verify img version
        run: |
          set -euo pipefail
          expected_file="${RUNNER_TEMP}/img-version-expected"
          actual_file="${RUNNER_TEMP}/img-version-actual"
          printf '%s\n' "$(tr -d '[:space:]' < apps/img/VERSION)" > "${expected_file}"
          ./zig-out/bin/img --version > "${actual_file}"
          if ! cmp -s "${expected_file}" "${actual_file}"; then
            echo "img --version did not exactly match apps/img/VERSION" >&2
            diff -u "${expected_file}" "${actual_file}" >&2 || true
            exit 1
          fi
      - name: Package img artifact
        run: |
          set -euo pipefail
          TAR_NAME="${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/img
          cp zig-out/bin/img dist/img/img
          cp -R apps/img/LICENSES dist/img/LICENSES
          tar -czf "${TAR_NAME}" -C dist/img img LICENSES
      - name: Verify img archive contents
        run: |
          set -euo pipefail
          entries="$(tar -tzf "${TAR_NAME}")"
          grep -Fxq 'img' <<< "${entries}"
          grep -Fxq 'LICENSES/Spleen.txt' <<< "${entries}"
          grep -Fxq 'LICENSES/Unifont.txt' <<< "${entries}"
          grep -Fxq 'LICENSES/pxpipe-MIT.txt' <<< "${entries}"
      - name: Upload img workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download img release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "${RELEASE_TAG}-*.tar.gz"
      - name: Verify img artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish img release assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -name '*.tar.gz' -print0 | sort -z)
          if gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${RELEASE_TAG}"
          fi
