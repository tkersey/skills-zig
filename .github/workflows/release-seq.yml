name: Release seq

on:
  push:
    tags:
      - "seq-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: release-seq-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            zig_target: x86_64-linux
            runs_on: ubuntu-latest
            zig_archive: zig-x86_64-linux-0.16.0.tar.xz
          - target: darwin-arm64
            zig_target: aarch64-macos
            runs_on: macos-14
            zig_archive: zig-aarch64-macos-0.16.0.tar.xz
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate tag matches apps/seq/VERSION
        run: |
          version="$(tr -d '[:space:]' < apps/seq/VERSION)"
          expected_tag="seq-v${version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: got '${RELEASE_TAG}', expected '${expected_tag}'"
            exit 1
          fi
      - name: Set tarball name
        run: echo "TAR_NAME=${RELEASE_TAG}-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          archive="${{ matrix.zig_archive }}"
          curl -fsSLO "https://ziglang.org/download/0.16.0/${archive}"
          tar -xf "${archive}"
          zig_dir="${archive%.tar.xz}"
          echo "${PWD}/${zig_dir}" >> "$GITHUB_PATH"
      - name: Prepare Zig package cache
        run: mkdir -p "${HOME}/.cache/zig/tmp"
      - name: Build seq binary
        working-directory: apps/seq
        run: zig build -Dtarget=${{ matrix.zig_target }} -Dcpu=baseline -Doptimize=ReleaseFast
      - name: Verify platform-gated seq command and capability surface
        run: apps/seq/scripts/release/command_surface_gate.sh apps/seq/zig-out/bin/seq
      - name: Exercise packaged Seq HCTP source compile and validation
        if: matrix.target == 'darwin-arm64'
        run: >-
          zig build test-hylo-operator-recipe-seq-release-runtime
          -Dhylo-operator-seq-path="${PWD}/apps/seq/zig-out/bin/seq"
          --summary all
      - name: Package seq artifact
        run: |
          mkdir -p dist/seq
          cp apps/seq/zig-out/bin/seq dist/seq/seq
          tar -czf "${TAR_NAME}" -C dist/seq seq
      - name: Upload seq workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download seq release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "${RELEASE_TAG}-*.tar.gz"
      - name: Verify seq artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish seq release assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -name '*.tar.gz' -print0 | sort -z)
          if gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${RELEASE_TAG}"
          fi
