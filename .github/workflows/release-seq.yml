name: Release seq

on:
  push:
    tags:
      - "seq-v*"

permissions:
  contents: write

concurrency:
  group: release-seq-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs_on: ubuntu-latest
          - target: darwin-arm64
            runs_on: macos-14
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches apps/seq/VERSION
        run: |
          version="$(tr -d '[:space:]' < apps/seq/VERSION)"
          expected_tag="seq-v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag mismatch: got '${GITHUB_REF_NAME}', expected '${expected_tag}'"
            exit 1
          fi
      - name: Set tarball name
        run: echo "TAR_NAME=${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build seq binary
        working-directory: apps/seq
        run: zig build -Doptimize=ReleaseFast
      - name: Package seq artifact
        run: |
          mkdir -p dist/seq
          cp apps/seq/zig-out/bin/seq dist/seq/seq
          tar -czf "${TAR_NAME}" -C dist/seq seq
      - name: Upload seq workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download seq release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.ref_name }}-*.tar.gz
          path: release-assets
          merge-multiple: true
      - name: Verify seq artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish seq release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: release-assets/*.tar.gz
