name: Release cas

on:
  push:
    tags:
      - "cas-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-cas-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            zig_target: x86_64-linux
            runs_on: ubuntu-latest
          - target: darwin-arm64
            zig_target: aarch64-macos
            runs_on: macos-14
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate cas tag matches VERSION
        run: |
          expected_tag="cas-v$(tr -d '[:space:]' < apps/cas/VERSION)"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build cas binaries
        run: zig build build-cas -Dtarget=${{ matrix.zig_target }} -Dcpu=baseline -Doptimize=ReleaseFast
      - name: Verify platform-gated CAS trial surface
        shell: bash
        run: |
          set -euo pipefail
          capabilities="$(./zig-out/bin/cas capabilities --json)"
          if [ "${{ matrix.target }}" = "darwin-arm64" ]; then
            for feature in \
              hylo_trial_runner_v1 \
              hylo_trial_runner_v2 \
              hylo_fd_lane_lease_v1 \
              hylo_signed_run_receipt_v1 \
              hylo_signed_run_receipt_v2 \
              hylo_private_lane_materialization_fd_v1 \
              hylo_target_common_projection_opening_v1 \
              hylo_private_receipt_redaction_v1 \
              hylo_trial_route_projection_v1 \
              hylo_internal_historical_replay_v1
            do
              if ! jq -e --arg feature "$feature" \
                '.cas_capabilities.features[$feature] == true' \
                <<<"$capabilities" >/dev/null
              then
                echo "macOS CAS capabilities missing ${feature}=true" >&2
                exit 1
              fi
            done
            trial_help="$(./zig-out/bin/cas_trial --help)"
            for required_help in \
              'compile-replay' \
              '--source-profile-fd N' \
              '--materialization-fd N' \
              'hylo-trial/v2' \
              'commitment-only hylo-run-receipt/v2' \
              'materialization_claim_fingerprint' \
              'compile-replay` is diagnostic-only' \
              'hylo-target-common-projection-opening/v1 as target_common_projection_opening'
            do
              if ! grep -Fq -- "$required_help" <<<"$trial_help"; then
                echo "macOS CAS trial help missing ${required_help}" >&2
                exit 1
              fi
            done
            ./zig-out/bin/cas_trial preflight \
              --trial testdata/hctp-v1/valid-null-trial.json \
              --lane-id lane-null-a0 --json > direct-preflight.json
            jq -e '
              .source_profile_kind == "direct" and
              .compile_replay_required == false and
              .replay_preparation_mode == "none" and
              .source_kind == .source_profile_kind and
              (has("historical_replay_required") | not) and
              .source_profile_body_delivery == "none" and
              .execution_route == "direct" and
              .required_lineage == null
            ' direct-preflight.json >/dev/null
          else
            for feature in \
              hylo_trial_runner_v1 \
              hylo_trial_runner_v2 \
              hylo_fd_lane_lease_v1 \
              hylo_signed_run_receipt_v1 \
              hylo_signed_run_receipt_v2 \
              hylo_private_lane_materialization_fd_v1 \
              hylo_target_common_projection_opening_v1 \
              hylo_private_receipt_redaction_v1 \
              hylo_trial_route_projection_v1 \
              hylo_internal_historical_replay_v1
            do
              if jq -e --arg feature "$feature" \
                '.cas_capabilities.features | has($feature)' \
                <<<"$capabilities" >/dev/null
              then
                echo "non-macOS CAS capabilities expose ${feature}" >&2
                exit 1
              fi
            done
            help="$(./zig-out/bin/cas --help)"
            if grep -Fq -- 'trial' <<<"$help"; then
              echo "non-macOS CAS help exposes the trial product" >&2
              exit 1
            fi
          fi
      - name: Verify Linux dispatcher can launch its sibling executable
        if: matrix.target == 'linux-x86_64'
        run: zig build test-cas-dispatch-runtime-linux -Dtarget=${{ matrix.zig_target }} -Dcpu=baseline -Doptimize=ReleaseFast --summary all
      - name: Package cas artifact
        run: |
          TAR_NAME="${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/cas
          cp zig-out/bin/cas dist/cas/cas
          cp zig-out/bin/cas_account dist/cas/cas_account
          cp zig-out/bin/cas_smoke_check dist/cas/cas_smoke_check
          cp zig-out/bin/cas_smoke_check dist/cas/cas-smoke-check
          cp zig-out/bin/cas_instance_runner dist/cas/cas_instance_runner
          cp zig-out/bin/cas_instance_runner dist/cas/cas-instance-runner
          cp zig-out/bin/cas_review_session dist/cas/cas_review_session
          cp zig-out/bin/cas_review_session dist/cas/cas-review-session
          cp zig-out/bin/cas_session_inquiry dist/cas/cas_session_inquiry
          cp zig-out/bin/cas_session_inquiry dist/cas/cas-session-inquiry
          if [ "${{ matrix.target }}" = "darwin-arm64" ]; then
            cp zig-out/bin/cas_trial dist/cas/cas_trial
          fi
          cp zig-out/bin/cas_conformance_suite dist/cas/cas_conformance_suite
          cp zig-out/bin/cas_conformance_suite dist/cas/cas-conformance-suite
          cp zig-out/bin/cas_goal dist/cas/cas_goal
          cp zig-out/bin/cas_goal dist/cas/cas-goal
          cp zig-out/bin/cas-perf-budget-governor dist/cas/cas-perf-budget-governor
          tar -czf "${TAR_NAME}" -C dist/cas .
      - name: Verify platform-specific cas archive contents
        run: .github/scripts/verify_cas_archive.sh "${{ matrix.target }}" "${TAR_NAME}"
      - name: Upload cas workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download cas release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.RELEASE_TAG }}-*.tar.gz
          path: release-assets
          merge-multiple: true
      - name: Verify cas artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish cas release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: release-assets/*.tar.gz
