name: Release cas

on:
  push:
    tags:
      - "cas-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

permissions:
  actions: read
  contents: write

concurrency:
  group: release-cas-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            zig_target: x86_64-linux-musl
            cas_static: true
            runs_on: ubuntu-latest
          - target: darwin-arm64
            zig_target: aarch64-macos
            cas_static: false
            runs_on: macos-14
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate cas tag matches VERSION
        run: |
          expected_tag="cas-v$(tr -d '[:space:]' < apps/cas/VERSION)"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fetch pinned SQLite amalgamation
        shell: bash
        run: |
          set -euo pipefail
          sqlite_version=3450100
          sqlite_sha256=5592243caf28b2cdef41e6ab58d25d653dfc53deded8450eb66072c929f030c4
          sqlite_archive="${RUNNER_TEMP}/sqlite-amalgamation-${sqlite_version}.zip"
          sqlite_root="${RUNNER_TEMP}/sqlite-amalgamation-${sqlite_version}"
          curl --fail --location --retry 3 \
            --output "${sqlite_archive}" \
            "https://www.sqlite.org/2024/sqlite-amalgamation-${sqlite_version}.zip"
          actual_sha256="$(shasum -a 256 "${sqlite_archive}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${sqlite_sha256}" ]]; then
            echo "SQLite archive digest mismatch: ${actual_sha256}" >&2
            exit 1
          fi
          unzip -q "${sqlite_archive}" -d "${RUNNER_TEMP}"
          test -f "${sqlite_root}/sqlite3.c"
          echo "CAS_SQLITE_AMALGAMATION=${sqlite_root}/sqlite3.c" >> "${GITHUB_ENV}"
      - name: Build cas binaries
        run: >-
          zig build build-cas
          -Dtarget=${{ matrix.zig_target }}
          -Dcpu=baseline
          -Doptimize=ReleaseFast
          -Dcas-static=${{ matrix.cas_static }}
          -Dcas-sqlite-amalgamation="${CAS_SQLITE_AMALGAMATION}"
      - name: Verify pinned SQLite release boundary
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              for binary in \
                cas cas_account cas_app_server_preflight cas_automation \
                cas_smoke_check cas_instance_runner cas_review_session \
                cas_session_inquiry cas_conformance_suite cas_goal \
                cas-perf-budget-governor; do
                if objdump -p "zig-out/bin/${binary}" | grep -Fq NEEDED; then
                  echo "CAS release binary is dynamically linked: ${binary}" >&2
                  exit 1
                fi
              done
              ;;
            macOS)
              if otool -L zig-out/bin/cas_automation | grep -Fq libsqlite3; then
                echo "CAS Automation unexpectedly depends on system SQLite" >&2
                exit 1
              fi
              ;;
          esac
          apps/cas/testdata/automation/cron-0.2.13/verify.sh \
            ./zig-out/bin/cas automation
      - name: Verify removed CAS product stays absent
        shell: bash
        run: |
          set -euo pipefail
          if ./zig-out/bin/cas trial --help >/dev/null 2>&1; then
            echo "CAS dispatcher exposes removed trial route" >&2
            exit 1
          fi
          if ./zig-out/bin/cas capabilities --json | grep -Eq '"hylo_|"hctp_'; then
            echo "CAS capabilities expose removed product features" >&2
            exit 1
          fi
      - name: Verify Linux dispatcher can launch its sibling executable
        if: matrix.target == 'linux-x86_64'
        run: >-
          zig build test-cas-dispatch-runtime-linux
          -Dtarget=${{ matrix.zig_target }}
          -Dcpu=baseline
          -Doptimize=ReleaseFast
          -Dcas-static=${{ matrix.cas_static }}
          -Dcas-sqlite-amalgamation="${CAS_SQLITE_AMALGAMATION}"
          --summary all
      - name: Package cas artifact
        run: |
          TAR_NAME="${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/cas
          cp zig-out/bin/cas dist/cas/cas
          cp zig-out/bin/cas_account dist/cas/cas_account
          cp zig-out/bin/cas_app_server_preflight dist/cas/cas_app_server_preflight
          cp zig-out/bin/cas_automation dist/cas/cas_automation
          cp zig-out/bin/cas_smoke_check dist/cas/cas_smoke_check
          cp zig-out/bin/cas_smoke_check dist/cas/cas-smoke-check
          cp zig-out/bin/cas_instance_runner dist/cas/cas_instance_runner
          cp zig-out/bin/cas_instance_runner dist/cas/cas-instance-runner
          cp zig-out/bin/cas_review_session dist/cas/cas_review_session
          cp zig-out/bin/cas_review_session dist/cas/cas-review-session
          cp zig-out/bin/cas_session_inquiry dist/cas/cas_session_inquiry
          cp zig-out/bin/cas_session_inquiry dist/cas/cas-session-inquiry
          cp zig-out/bin/cas_conformance_suite dist/cas/cas_conformance_suite
          cp zig-out/bin/cas_conformance_suite dist/cas/cas-conformance-suite
          cp zig-out/bin/cas_goal dist/cas/cas_goal
          cp zig-out/bin/cas_goal dist/cas/cas-goal
          cp zig-out/bin/cas-perf-budget-governor dist/cas/cas-perf-budget-governor
          tar -czf "${TAR_NAME}" -C dist/cas .
      - name: Verify platform-specific cas archive contents
        run: .github/scripts/verify_cas_archive.sh "${{ matrix.target }}" "${TAR_NAME}"
      - name: Upload cas workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download cas release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.RELEASE_TAG }}-*.tar.gz
          path: release-assets
          merge-multiple: true
      - name: Verify cas artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Bind publication tag to release commit
        shell: bash
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          object_type="$(jq -r '.object.type' <<<"${ref_json}")"
          tag_sha="$(jq -r '.object.sha' <<<"${ref_json}")"
          for _ in 1 2 3 4; do
            if [ "${object_type}" = "commit" ]; then
              break
            fi
            if [ "${object_type}" != "tag" ]; then
              echo "Release tag resolves to unsupported Git object type: ${object_type}" >&2
              exit 1
            fi
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
            object_type="$(jq -r '.object.type' <<<"${tag_json}")"
            tag_sha="$(jq -r '.object.sha' <<<"${tag_json}")"
          done
          if [ "${object_type}" != "commit" ] || [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
            echo "Release tag does not resolve to release commit ${GITHUB_SHA}: ${object_type} ${tag_sha}" >&2
            exit 1
          fi
      - name: Publish cas release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: release-assets/*.tar.gz
