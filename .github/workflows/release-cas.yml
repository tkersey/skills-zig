name: Release cas

on:
  push:
    tags:
      - "cas-v*"

permissions:
  contents: write

concurrency:
  group: release-cas-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs_on: ubuntu-latest
          - target: darwin-arm64
            runs_on: macos-14
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate cas tag matches VERSION
        run: |
          expected_tag="cas-v$(tr -d '[:space:]' < apps/cas/VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build cas binaries
        run: zig build build-cas -Doptimize=ReleaseFast
      - name: Package cas artifact
        run: |
          TAR_NAME="${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/cas
          cp zig-out/bin/cas dist/cas/cas
          cp zig-out/bin/cas_smoke_check dist/cas/cas-smoke-check
          cp zig-out/bin/cas_instance_runner dist/cas/cas-instance-runner
          cp zig-out/bin/cas_review_session dist/cas/cas-review-session
          cp zig-out/bin/cas_conformance_suite dist/cas/cas-conformance-suite
          tar -czf "${TAR_NAME}" -C dist/cas .
      - name: Upload cas workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download cas release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.ref_name }}-*.tar.gz
          path: release-assets
          merge-multiple: true
      - name: Verify cas artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish cas release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: release-assets/*.tar.gz
