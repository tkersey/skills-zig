name: Release parse-arch

on:
  push:
    tags:
      - "parse-arch-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-parse-arch-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs_on: ubuntu-latest
          - target: darwin-arm64
            runs_on: macos-14
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate parse-arch tag matches VERSION
        run: |
          expected_tag="parse-arch-v$(tr -d '[:space:]' < apps/parse-arch/VERSION)"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build parse-arch binary
        run: zig build build-parse-arch -Doptimize=ReleaseFast
      - name: Test parse-arch
        run: zig build test-parse-arch
      - name: Package parse-arch artifact
        run: |
          TAR_NAME="${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/parse-arch
          cp zig-out/bin/parse-arch dist/parse-arch/parse-arch
          tar -czf "${TAR_NAME}" -C dist/parse-arch .
      - name: Upload parse-arch workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download parse-arch release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.RELEASE_TAG }}-*.tar.gz
          path: release-assets
          merge-multiple: true
      - name: Verify parse-arch artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish parse-arch release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: release-assets/*.tar.gz
