name: Release ledger

on:
  push:
    tags:
      - "ledger-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: release-ledger-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            zig_target: x86_64-linux
            runs_on: ubuntu-latest
            zig_archive: zig-x86_64-linux-0.16.0.tar.xz
          - target: darwin-arm64
            zig_target: aarch64-macos
            runs_on: macos-14
            zig_archive: zig-aarch64-macos-0.16.0.tar.xz
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate ledger tag matches VERSION
        run: |
          expected_tag="ledger-v$(tr -d '[:space:]' < apps/ledger/VERSION)"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: expected ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          archive="${{ matrix.zig_archive }}"
          curl -fsSLO "https://ziglang.org/download/0.16.0/${archive}"
          tar -xf "${archive}"
          zig_dir="${archive%.tar.xz}"
          echo "${PWD}/${zig_dir}" >> "$GITHUB_PATH"
      - name: Build ledger binary
        run: zig build build-ledger -Dtarget=${{ matrix.zig_target }} -Dcpu=baseline -Doptimize=ReleaseFast
      - name: Verify portable and platform-gated Hylo surfaces
        shell: bash
        run: |
          set -euo pipefail
          ./zig-out/bin/ledger validate hylo-trial \
            --input testdata/hctp-v1/valid-trial.json > hylo-trial-validation.json
          jq -e '
            .schema == "ledger-validate-decision/v1" and
            .contract == "hylo-trial" and
            .verdict == "pass" and
            .authority_granted == false and
            .storage_mutated == false
          ' hylo-trial-validation.json >/dev/null

          if [ "${{ matrix.target }}" = "darwin-arm64" ]; then
            help="$(./zig-out/bin/ledger --source hylo --help)"
            for surface in \
              compile-trial \
              validate-trial \
              register-trial \
              start-lane \
              commit-lane-start \
              lane-materialization \
              reveal-trial
            do
              if ! grep -Fq -- "$surface" <<<"$help"; then
                echo "macOS Hylo help missing ${surface}" >&2
                exit 1
              fi
            done
            for protected_fd in \
              '--custody-output-fd N' \
              '--custody-input-fd N' \
              '--materialization-output-fd N'
            do
              if ! grep -Fq -- "$protected_fd" <<<"$help"; then
                echo "macOS Hylo help missing canonical protected FD: ${protected_fd}" >&2
                exit 1
              fi
            done
            for compatibility_fd in '--reveal-output-fd N' '--reveal-material-fd N'; do
              if ! grep -Fq -- "$compatibility_fd" <<<"$help"; then
                echo "macOS Hylo help missing compatibility FD: ${compatibility_fd}" >&2
                exit 1
              fi
            done
            capabilities="$(./zig-out/bin/ledger --source hylo capabilities)"
            for feature in \
              hylo_trial_v1 \
              hylo_trial_v2 \
              hylo_trial_compiler_v1 \
              hylo_reveal_material_fd_v1 \
              hylo_private_trial_custody_v1 \
              hylo_trial_custody_fd_v1 \
              hylo_private_lane_start_custody_fd_v1 \
              hylo_trial_build_receipt_v2 \
              hylo_lane_materialization_v1 \
              hylo_lane_materialization_receipt_v2 \
              hylo_trial_reveal_v1 \
              hylo_trial_reveal_v2 \
              hylo_run_receipt_v2
            do
              if ! jq -e --arg feature "$feature" \
                '.schema == "hylo-capabilities/v1" and (.features | index($feature) != null)' \
                <<<"$capabilities" >/dev/null
              then
                echo "macOS Hylo capabilities missing ${feature}" >&2
                exit 1
              fi
            done
          elif ./zig-out/bin/ledger --source hylo --help >/tmp/hylo-help 2>&1 || \
            ./zig-out/bin/ledger --source hylo capabilities >/tmp/hylo-capabilities 2>&1
          then
            echo "non-macOS Ledger exposes the Hylo product source" >&2
            exit 1
          fi
      - name: Exercise packaged Ledger trial compile and registration
        if: matrix.target == 'darwin-arm64'
        run: >-
          zig build test-hylo-operator-recipe-ledger-release-runtime
          -Dhylo-operator-ledger-path="${PWD}/zig-out/bin/ledger"
          --summary all
      - name: Package ledger artifact
        run: |
          TAR_NAME="${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          mkdir -p dist/ledger
          cp zig-out/bin/ledger dist/ledger/ledger
          tar -czf "${TAR_NAME}" -C dist/ledger ledger
      - name: Upload ledger workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download ledger release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "${RELEASE_TAG}-*.tar.gz"
      - name: Verify ledger artifact set
        run: |
          set -euo pipefail
          count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "${count}" -ne 2 ]; then
            echo "Expected 2 release archives, got ${count}" >&2
            exit 1
          fi
      - name: Publish ledger release assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -name '*.tar.gz' -print0 | sort -z)
          if gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${RELEASE_TAG}"
          fi
