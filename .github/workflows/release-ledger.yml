name: Release ledger

on:
  push:
    tags:
      - "ledger-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-ledger-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            zig_target: x86_64-linux
            runs_on: ubuntu-latest
            zig_archive: zig-x86_64-linux-0.17.0.tar.xz
            zig_sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          - target: darwin-arm64
            zig_target: aarch64-macos.15.0
            runs_on: macos-15
            zig_archive: zig-aarch64-macos-0.17.0.tar.xz
            zig_sha256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
          - target: windows-x86_64
            zig_target: x86_64-windows-gnu
            runs_on: windows-2025
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Validate tag matches apps/ledger/VERSION
        run: |
          version="$(tr -d '[:space:]' < apps/ledger/VERSION)"
          expected_tag="ledger-v${version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag mismatch: got '${RELEASE_TAG}', expected '${expected_tag}'"
            exit 1
          fi
      - name: Set tarball name
        if: runner.os != 'Windows'
        run: echo "TAR_NAME=${RELEASE_TAG}-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"
      - name: Install Zig 0.17.0
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          archive="${{ matrix.zig_archive }}"
          curl -fsSLO "https://ziglang.org/download/0.17.0/${archive}"
          echo "${{ matrix.zig_sha256 }}  ${archive}" | shasum -a 256 -c -
          tar -xf "${archive}"
          zig_dir="${archive%.tar.xz}"
          echo "${PWD}/${zig_dir}" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Windows'
        with:
          version: 0.17.0
          cache-key: app-ledger
      - name: Qualify and package native Windows artifact
        if: runner.os == 'Windows'
        run: python .github/scripts/release_artifacts.py windows ledger --tag "$RELEASE_TAG"
      - name: Build ledger binary
        if: runner.os != 'Windows'
        run: zig build build-ledger -Dtarget=${{ matrix.zig_target }} -Dcpu=baseline -Doptimize=fast
      - name: Verify Ledger 1.0 command and capability surface
        if: runner.os != 'Windows'
        run: apps/ledger/scripts/release/command_surface_gate.sh zig-out/bin/ledger
      - name: Package ledger artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/ledger
          cp zig-out/bin/ledger dist/ledger/ledger
          tar -czf "${TAR_NAME}" -C dist/ledger ledger
          echo "RELEASE_ARCHIVE=$TAR_NAME" >> "$GITHUB_ENV"
      - name: Upload ledger workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_ARCHIVE }}
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error
          overwrite: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download ledger release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "${RELEASE_TAG}-*"
      - name: Verify ledger artifact set
        run: python3 .github/scripts/release_artifacts.py verify-set ledger "$RELEASE_TAG" release-assets
      - name: Verify Ledger release tag commit
        run: |
          set -euo pipefail

          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          object_type="$(jq -r '.object.type' <<<"${ref_json}")"
          tag_sha="$(jq -r '.object.sha' <<<"${ref_json}")"
          for _ in 1 2 3 4; do
            if [ "${object_type}" = "commit" ]; then
              break
            fi
            if [ "${object_type}" != "tag" ]; then
              echo "Release tag resolves to unsupported Git object type: ${object_type}" >&2
              exit 1
            fi
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
            object_type="$(jq -r '.object.type' <<<"${tag_json}")"
            tag_sha="$(jq -r '.object.sha' <<<"${tag_json}")"
          done
          if [ "${object_type}" != "commit" ] || [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
            echo "Release tag does not resolve to release commit ${GITHUB_SHA}: ${object_type} ${tag_sha}" >&2
            exit 1
          fi
      - name: Publish ledger release assets
        run: |
          set -euo pipefail
          qualified_assets="$(python3 .github/scripts/release_artifacts.py verify-set ledger "$RELEASE_TAG" release-assets)"
          mapfile -t assets <<< "$qualified_assets"
          if gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${RELEASE_TAG}"
          fi
