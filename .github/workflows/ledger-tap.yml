name: Update Ledger tap

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published Ledger release tag to retry
        required: true
        type: string
      commit_sha:
        description: Expected release commit (set by the release workflow)
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/ledger-tap.yml"
      - ".github/workflows/release-ledger.yml"
      - ".github/homebrew-tap/**"

permissions:
  contents: read

concurrency:
  group: ledger-tap-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node --test .github/homebrew-tap/*.test.cjs

  update:
    needs: test
    if: >-
      github.repository == 'tkersey/skills-zig' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check tap credential
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Contents and Pull requests write access to tkersey/homebrew-tap."
            exit 1
          fi
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: tkersey/homebrew-tap
          ref: main
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
      - name: Verify published archives and update formula
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
        run: |
          node .github/homebrew-tap/prepare.cjs ledger tap/Formula/ledger.rb
          cp tap/Formula/ledger.rb "$RUNNER_TEMP/ledger-verified.rb"
      - name: Open or update tap PR
        id: pr
        if: steps.formula.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          base: main
          branch: automation/ledger-${{ steps.formula.outputs.version }}
          add-paths: Formula/ledger.rb
          commit-message: "ledger ${{ steps.formula.outputs.version }}"
          title: "ledger ${{ steps.formula.outputs.version }}"
          body: |
            Update Ledger to [${{ steps.formula.outputs.version }}](https://github.com/tkersey/skills-zig/releases/tag/ledger-v${{ steps.formula.outputs.version }}).

            Both published platform archives were downloaded and their SHA256 digests verified before updating the formula. The tap's macOS and Linux CI must pass before merge.
      - name: Wait for checks and merge verified head
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_PR: ${{ steps.pr.outputs.pull-request-number }}
          TAP_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
          TAP_VERSION: ${{ steps.formula.outputs.version }}
        run: node .github/homebrew-tap/auto-merge.cjs "$RUNNER_TEMP/ledger-verified.rb"
