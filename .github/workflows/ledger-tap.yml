name: Update Ledger tap

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published Ledger release tag to retry
        required: true
        type: string
      commit_sha:
        description: Expected release commit (set by the release workflow)
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  handoff:
    uses: ./.github/workflows/tap-handoff.yml
    with:
      app: ledger
      tag_name: ${{ inputs.tag_name }}
      commit_sha: ${{ inputs.commit_sha }}
    secrets: inherit
